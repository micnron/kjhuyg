<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Busque Ajuda</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #FFDD00; /* Fundo amarelo */
      color: #000; /* Texto preto para alto contraste */
    }

    .container {
      display: flex;
      flex-direction: row;
      border-left: 5px solid #000;
      border-right: 5px solid #000;
      margin: 0 auto;
      max-width: 1200px;
      min-height: 100vh;
      position: relative;
    }

    .left-col, .center-col, .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }

    .left-col {
      border-right: 2px solid #000;
    }
    .center-col {
      border-right: 2px solid #000;
    }

    h1, h2 {
      text-align: center;
    }

    .red {
      color: red;
    }

    /* Botões */
    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .option-btn {
      background-color: #fff;
      border: 2px solid #000;
      border-radius: 5px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .option-btn.selected {
      background-color: #000;
      color: #fff;
    }

    #localInput {
      display: none;
      margin: 10px 0;
    }

    #localInput input {
      padding: 5px;
      font-size: 1rem;
      width: 200px;
      border: 2px solid #000;
      border-radius: 5px;
    }

    .time-input {
      margin-bottom: 20px;
    }

    .time-input input {
      padding: 5px;
      font-size: 1rem;
      border: 2px solid #000;
      border-radius: 5px;
    }

    /* Acessibilidade */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        border-left: none;
        border-right: none;
        border-top: 5px solid #000;
        border-bottom: 5px solid #000;
      }

      .left-col, .center-col, .right-col {
        border-right: none;
        border-bottom: 2px solid #000;
      }

      .right-col {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="left-col">
      <h1>
        <span class="red">B</span
